<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f1f3d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Outer glow ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Shield body -->
  <path d="M64 18 L96 30 L96 60 Q96 85 64 108 Q32 85 32 60 L32 30 Z"
        fill="url(#shield)" opacity="0.15" filter="url(#glow)"/>
  <path d="M64 22 L93 33 L93 60 Q93 82 64 104 Q35 82 35 60 L35 33 Z"
        fill="none" stroke="url(#shield)" stroke-width="2.5"/>

  <!-- AI circuit lines inside shield -->
  <g stroke="#60a5fa" stroke-width="1.2" opacity="0.7">
    <line x1="64" y1="44" x2="64" y2="56"/>
    <line x1="54" y1="50" x2="74" y2="50"/>
    <circle cx="64" cy="44" r="3" fill="#60a5fa"/>
    <circle cx="54" cy="50" r="2.5" fill="#06b6d4"/>
    <circle cx="74" cy="50" r="2.5" fill="#06b6d4"/>
    <line x1="54" y1="50" x2="48" y2="58"/>
    <line x1="74" y1="50" x2="80" y2="58"/>
    <circle cx="48" cy="58" r="2" fill="#818cf8"/>
    <circle cx="80" cy="58" r="2" fill="#818cf8"/>
  </g>

  <!-- Checkmark -->
  <path d="M50 68 L60 78 L80 58"
        fill="none" stroke="#34d399" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text: AI -->
  <text x="64" y="98" text-anchor="middle"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-weight="800" font-size="11"
        fill="#60a5fa" letter-spacing="3">AI</text>
</svg>
